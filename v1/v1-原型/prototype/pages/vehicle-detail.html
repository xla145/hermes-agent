<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>车辆详情 - 智能物流管理系统</title>
    <link rel="stylesheet" href="../assets/css/styles.css">
</head>
<body>
    <div class="app">
        <aside class="sidebar">
            <div class="brand"><span class="brand-icon">🚚</span><span class="brand-text">智能物流系统</span></div>
            <nav class="nav">
                <div class="nav-section">
                    <div class="nav-section-title">主要功能</div>
                    <a href="../index.html" class="nav-link"><span class="nav-icon">📊</span><span>首页</span></a>
                    <a href="orders.html" class="nav-link"><span class="nav-icon">📋</span><span>订单管理</span></a>
                    <a href="vehicles.html" class="nav-link active"><span class="nav-icon">🚛</span><span>车辆管理</span></a>
                    <a href="drivers.html" class="nav-link"><span class="nav-icon">👤</span><span>司机管理</span></a>
                    <a href="dispatch.html" class="nav-link"><span class="nav-icon">🎯</span><span>智能调度</span></a>
                    <a href="tracking.html" class="nav-link"><span class="nav-icon">🗺️</span><span>运输轨迹</span></a>
                    <a href="exceptions.html" class="nav-link"><span class="nav-icon">⚠️</span><span>异常处理</span></a>
                    <a href="receipts.html" class="nav-link"><span class="nav-icon">📄</span><span>签收回单</span></a>
                    <a href="dashboard.html" class="nav-link"><span class="nav-icon">📈</span><span>数据看板</span></a>
                </div>
                <div class="nav-section">
                    <div class="nav-section-title">系统设置</div>
                    <a href="users.html" class="nav-link"><span class="nav-icon">⚙️</span><span>用户管理</span></a>
                    <a href="roles.html" class="nav-link"><span class="nav-icon">🔐</span><span>角色权限</span></a>
                </div>
            </nav>
        </aside>

        <main class="main">
            <header class="topbar">
                <div class="topbar-left">
                    <button class="btn-ghost toggle-sidebar" onclick="toggleSidebar()">☰</button>
                    <div class="breadcrumb"><a href="../index.html">首页</a><span>/</span><a href="vehicles.html">车辆管理</a><span>/</span><span>车辆详情</span></div>
                </div>
                <div class="topbar-right"><div class="user-info"><span class="user-avatar">管</span><span class="user-name">管理员</span></div></div>
            </header>

            <div class="content">
                <div class="page-header">
                    <h1>车辆详情</h1>
                    <a href="vehicles.html" class="btn btn-secondary">返回列表</a>
                </div>

                <div class="detail-grid">
                    <div class="card">
                        <div class="card-header"><span class="card-title">基本信息</span><span class="badge badge-success">运输中</span></div>
                        <table class="detail-table">
                            <tr><td class="label">车牌号</td><td>粤B12345</td></tr>
                            <tr><td class="label">车型</td><td>厢式货车</td></tr>
                            <tr><td class="label">载重</td><td>5000kg</td></tr>
                            <tr><td class="label">容积</td><td>20m³</td></tr>
                        </table>
                    </div>
                    <div class="card">
                        <div class="card-header"><span class="card-title">设备信息</span></div>
                        <table class="detail-table">
                            <tr><td class="label">GPS设备</td><td>GPS-001</td></tr>
                            <tr><td class="label">设备状态</td><td>在线</td></tr>
                            <tr><td class="label">当前位置</td><td>湖南省长沙市</td></tr>
                        </table>
                    </div>
                    <div class="card">
                        <div class="card-header"><span class="card-title">承运信息</span></div>
                        <table class="detail-table">
                            <tr><td class="label">司机</td><td>王师傅</td></tr>
                            <tr><td class="label">电话</td><td>139****9001</td></tr>
                            <tr><td class="label">当前订单</td><td>ORD20240525005</td></tr>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <script src="../assets/js/app.js"></script>
    <style>
        .page-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .page-header h1 { font-size: 20px; margin: 0; }
        .detail-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
        .detail-table { width: 100%; }
        .detail-table td { padding: 12px; border-bottom: 1px solid #f0f0f0; }
        .detail-table .label { color: #8c8c8c; width: 100px; }
    </style>
</body>
</html>
