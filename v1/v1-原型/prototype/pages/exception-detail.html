<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>异常详情 - 智能物流管理系统</title>
    <link rel="stylesheet" href="../assets/css/styles.css">
</head>
<body>
    <div class="app">
        <aside class="sidebar">
            <div class="brand"><span class="brand-icon">🚚</span><span class="brand-text">智能物流系统</span></div>
            <nav class="nav">
                <div class="nav-section">
                    <div class="nav-section-title">主要功能</div>
                    <a href="../index.html" class="nav-link"><span class="nav-icon">📊</span><span>首页</span></a>
                    <a href="orders.html" class="nav-link"><span class="nav-icon">📋</span><span>订单管理</span></a>
                    <a href="vehicles.html" class="nav-link"><span class="nav-icon">🚛</span><span>车辆管理</span></a>
                    <a href="drivers.html" class="nav-link"><span class="nav-icon">👤</span><span>司机管理</span></a>
                    <a href="dispatch.html" class="nav-link"><span class="nav-icon">🎯</span><span>智能调度</span></a>
                    <a href="tracking.html" class="nav-link"><span class="nav-icon">🗺️</span><span>运输轨迹</span></a>
                    <a href="exceptions.html" class="nav-link active"><span class="nav-icon">⚠️</span><span>异常处理</span></a>
                    <a href="receipts.html" class="nav-link"><span class="nav-icon">📄</span><span>签收回单</span></a>
                    <a href="dashboard.html" class="nav-link"><span class="nav-icon">📈</span><span>数据看板</span></a>
                </div>
                <div class="nav-section">
                    <div class="nav-section-title">系统设置</div>
                    <a href="users.html" class="nav-link"><span class="nav-icon">⚙️</span><span>用户管理</span></a>
                    <a href="roles.html" class="nav-link"><span class="nav-icon">🔐</span><span>角色权限</span></a>
                </div>
            </nav>
        </aside>

        <main class="main">
            <header class="topbar">
                <div class="topbar-left">
                    <button class="btn-ghost toggle-sidebar" onclick="toggleSidebar()">☰</button>
                    <div class="breadcrumb"><a href="../index.html">首页</a><span>/</span><a href="exceptions.html">异常处理</a><span>/</span><span>异常详情</span></div>
                </div>
                <div class="topbar-right"><div class="user-info"><span class="user-avatar">管</span><span class="user-name">管理员</span></div></div>
            </header>

            <div class="content">
                <div class="page-header">
                    <h1>异常详情</h1>
                    <a href="exceptions.html" class="btn btn-secondary">返回列表</a>
                </div>

                <div class="detail-grid">
                    <div class="card">
                        <div class="card-header"><span class="card-title">异常信息</span><span class="badge badge-warning">待处理</span></div>
                        <table class="detail-table">
                            <tr><td class="label">异常编号</td><td>EXC20240525001</td></tr>
                            <tr><td class="label">订单号</td><td>ORD20240524008</td></tr>
                            <tr><td class="label">异常类型</td><td>运输延迟</td></tr>
                            <tr><td class="label">创建时间</td><td>2024-05-25 14:30</td></tr>
                            <tr><td class="label">报告人</td><td>张师傅</td></tr>
                        </table>
                    </div>
                    <div class="card">
                        <div class="card-header"><span class="card-title">异常描述</span></div>
                        <div class="exception-desc">
                            <p>因天气原因，高速公路封闭，预计延迟2小时到达。</p>
                            <p>当前位于：湖北省武汉市</p>
                            <p>预计到达时间：18:00</p>
                        </div>
                    </div>
                </div>

                <div class="card" style="margin-top: 20px;">
                    <div class="card-header"><span class="card-title">处理异常</span></div>
                    <form onsubmit="event.preventDefault(); showToast('异常处理提交成功', 'success'); setTimeout(() => window.location.href='exceptions.html', 1000);">
                        <div class="form-field">
                            <label>处理方案 <span class="required">*</span></label>
                            <textarea class="textarea" placeholder="请输入处理方案" required style="min-height: 100px;"></textarea>
                        </div>
                        <div class="form-field" style="margin-top: 16px;">
                            <label>处理结果</label>
                            <select class="select">
                                <option value="">请选择</option>
                                <option value="resolved">已解决</option>
                                <option value="escalated">已升级</option>
                                <option value="pending">待跟进</option>
                            </select>
                        </div>
                        <div class="form-actions" style="margin-top: 20px;">
                            <button type="button" class="btn btn-secondary" onclick="window.location.href='exceptions.html'">取消</button>
                            <button type="submit" class="btn btn-primary">提交处理</button>
                        </div>
                    </form>
                </div>
            </div>
        </main>
    </div>

    <script src="../assets/js/app.js"></script>
    <style>
        .page-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .page-header h1 { font-size: 20px; margin: 0; }
        .detail-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; }
        .detail-table { width: 100%; }
        .detail-table td { padding: 12px; border-bottom: 1px solid #f0f0f0; }
        .detail-table .label { color: #8c8c8c; width: 100px; }
        .exception-desc { padding: 10px; line-height: 1.8; }
    </style>
</body>
</html>
