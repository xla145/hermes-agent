<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>签收回单 - 智能物流管理系统</title>
    <link rel="stylesheet" href="../assets/css/styles.css">
</head>
<body>
    <div class="app">
        <aside class="sidebar">
            <div class="brand"><span class="brand-icon">🚚</span><span class="brand-text">智能物流系统</span></div>
            <nav class="nav">
                <div class="nav-section">
                    <div class="nav-section-title">主要功能</div>
                    <a href="../index.html" class="nav-link"><span class="nav-icon">📊</span><span>首页</span></a>
                    <a href="orders.html" class="nav-link"><span class="nav-icon">📋</span><span>订单管理</span></a>
                    <a href="vehicles.html" class="nav-link"><span class="nav-icon">🚛</span><span>车辆管理</span></a>
                    <a href="drivers.html" class="nav-link"><span class="nav-icon">👤</span><span>司机管理</span></a>
                    <a href="dispatch.html" class="nav-link"><span class="nav-icon">🎯</span><span>智能调度</span></a>
                    <a href="tracking.html" class="nav-link"><span class="nav-icon">🗺️</span><span>运输轨迹</span></a>
                    <a href="exceptions.html" class="nav-link"><span class="nav-icon">⚠️</span><span>异常处理</span></a>
                    <a href="receipts.html" class="nav-link active"><span class="nav-icon">📄</span><span>签收回单</span></a>
                    <a href="dashboard.html" class="nav-link"><span class="nav-icon">📈</span><span>数据看板</span></a>
                </div>
                <div class="nav-section">
                    <div class="nav-section-title">系统设置</div>
                    <a href="users.html" class="nav-link"><span class="nav-icon">⚙️</span><span>用户管理</span></a>
                    <a href="roles.html" class="nav-link"><span class="nav-icon">🔐</span><span>角色权限</span></a>
                </div>
            </nav>
        </aside>

        <main class="main">
            <header class="topbar">
                <div class="topbar-left">
                    <button class="btn-ghost toggle-sidebar" onclick="toggleSidebar()">☰</button>
                    <div class="breadcrumb"><a href="../index.html">首页</a><span>/</span><span>签收回单</span></div>
                </div>
                <div class="topbar-right"><div class="user-info"><span class="user-avatar">管</span><span class="user-name">管理员</span></div></div>
            </header>

            <div class="content">
                <div class="page-header"><h1>签收回单</h1></div>

                <div class="toolbar card">
                    <div class="form-field">
                        <label>回单状态</label>
                        <select class="select">
                            <option value="">全部</option>
                            <option value="pending">待确认</option>
                            <option value="confirmed">已确认</option>
                        </select>
                    </div>
                    <div class="form-field"><label>&nbsp;</label><button class="btn btn-primary">查询</button></div>
                </div>

                <div class="card">
                    <table class="data-table">
                        <thead>
                            <tr><th>订单号</th><th>客户</th><th>上传时间</th><th>签收人</th><th>签收时间</th><th>状态</th><th>操作</th></tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td>ORD20240524006</td>
                                <td>江门食品公司</td>
                                <td>2024-05-25 16:00</td>
                                <td>王总</td>
                                <td>2024-05-25 15:30</td>
                                <td><span class="badge badge-warning">待确认</span></td>
                                <td><button class="btn btn-sm btn-primary" onclick="showToast('确认签收成功', 'success')">确认</button></td>
                            </tr>
                            <tr>
                                <td>ORD20240523008</td>
                                <td>长沙贸易公司</td>
                                <td>2024-05-24 10:00</td>
                                <td>李总</td>
                                <td>2024-05-24 09:45</td>
                                <td><span class="badge badge-success">已确认</span></td>
                                <td><a href="#" class="btn-link">查看</a></td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
    <script src="../assets/js/app.js"></script>
    <style>.page-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.page-header h1{font-size:20px;margin:0}</style>
</body>
</html>
