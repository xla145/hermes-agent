<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>新建订单 - 智能物流管理系统</title>
    <link rel="stylesheet" href="../assets/css/styles.css">
</head>
<body>
    <div class="app">
        <aside class="sidebar">
            <div class="brand"><span class="brand-icon">🚚</span><span class="brand-text">智能物流系统</span></div>
            <nav class="nav">
                <div class="nav-section">
                    <div class="nav-section-title">主要功能</div>
                    <a href="../index.html" class="nav-link"><span class="nav-icon">📊</span><span>首页</span></a>
                    <a href="orders.html" class="nav-link active"><span class="nav-icon">📋</span><span>订单管理</span></a>
                    <a href="vehicles.html" class="nav-link"><span class="nav-icon">🚛</span><span>车辆管理</span></a>
                    <a href="drivers.html" class="nav-link"><span class="nav-icon">👤</span><span>司机管理</span></a>
                    <a href="dispatch.html" class="nav-link"><span class="nav-icon">🎯</span><span>智能调度</span></a>
                    <a href="tracking.html" class="nav-link"><span class="nav-icon">🗺️</span><span>运输轨迹</span></a>
                    <a href="exceptions.html" class="nav-link"><span class="nav-icon">⚠️</span><span>异常处理</span></a>
                    <a href="receipts.html" class="nav-link"><span class="nav-icon">📄</span><span>签收回单</span></a>
                    <a href="dashboard.html" class="nav-link"><span class="nav-icon">📈</span><span>数据看板</span></a>
                </div>
                <div class="nav-section">
                    <div class="nav-section-title">系统设置</div>
                    <a href="users.html" class="nav-link"><span class="nav-icon">⚙️</span><span>用户管理</span></a>
                    <a href="roles.html" class="nav-link"><span class="nav-icon">🔐</span><span>角色权限</span></a>
                </div>
            </nav>
        </aside>

        <main class="main">
            <header class="topbar">
                <div class="topbar-left">
                    <button class="btn-ghost toggle-sidebar" onclick="toggleSidebar()">☰</button>
                    <div class="breadcrumb">
                        <a href="../index.html">首页</a><span>/</span><a href="orders.html">订单管理</a><span>/</span><span>新建订单</span>
                    </div>
                </div>
                <div class="topbar-right"><div class="user-info"><span class="user-avatar">管</span><span class="user-name">管理员</span></div></div>
            </header>

            <div class="content">
                <div class="page-header">
                    <h1>新建订单</h1>
                    <a href="orders.html" class="btn btn-secondary">取消</a>
                </div>

                <form class="card" data-validate onsubmit="event.preventDefault(); showToast('订单创建成功', 'success'); setTimeout(() => window.location.href='orders.html', 1000);">
                    <div class="form-section">
                        <h3 class="form-section-title">客户信息</h3>
                        <div class="form-row">
                            <div class="form-field">
                                <label>客户名称 <span class="required">*</span></label>
                                <select class="select" required>
                                    <option value="">请选择客户</option>
                                    <option value="C001">深圳科技有限公司</option>
                                    <option value="C002">广州贸易公司</option>
                                    <option value="C003">东莞电子厂</option>
                                    <option value="C004">佛山制造公司</option>
                                </select>
                            </div>
                        </div>
                    </div>

                    <div class="form-section">
                        <h3 class="form-section-title">发货信息</h3>
                        <div class="form-row">
                            <div class="form-field">
                                <label>发货城市 <span class="required">*</span></label>
                                <input type="text" class="input" placeholder="请输入发货城市" required>
                            </div>
                            <div class="form-field">
                                <label>详细地址 <span class="required">*</span></label>
                                <input type="text" class="input" placeholder="请输入详细地址" required>
                            </div>
                        </div>
                        <div class="form-row">
                            <div class="form-field">
                                <label>联系人 <span class="required">*</span></label>
                                <input type="text" class="input" placeholder="请输入联系人" required>
                            </div>
                            <div class="form-field">
                                <label>联系电话 <span class="required">*</span></label>
                                <input type="tel" class="input" placeholder="请输入联系电话" required>
                            </div>
                        </div>
                    </div>

                    <div class="form-section">
                        <h3 class="form-section-title">收货信息</h3>
                        <div class="form-row">
                            <div class="form-field">
                                <label>目的城市 <span class="required">*</span></label>
                                <input type="text" class="input" placeholder="请输入目的城市" required>
                            </div>
                            <div class="form-field">
                                <label>详细地址 <span class="required">*</span></label>
                                <input type="text" class="input" placeholder="请输入详细地址" required>
                            </div>
                        </div>
                        <div class="form-row">
                            <div class="form-field">
                                <label>联系人 <span class="required">*</span></label>
                                <input type="text" class="input" placeholder="请输入联系人" required>
                            </div>
                            <div class="form-field">
                                <label>联系电话 <span class="required">*</span></label>
                                <input type="tel" class="input" placeholder="请输入联系电话" required>
                            </div>
                        </div>
                    </div>

                    <div class="form-section">
                        <h3 class="form-section-title">货物信息</h3>
                        <div class="form-row">
                            <div class="form-field">
                                <label>货物名称 <span class="required">*</span></label>
                                <input type="text" class="input" placeholder="请输入货物名称" required>
                            </div>
                            <div class="form-field">
                                <label>货物数量 <span class="required">*</span></label>
                                <input type="number" class="input" placeholder="请输入数量" required>
                            </div>
                        </div>
                        <div class="form-row">
                            <div class="form-field">
                                <label>重量(kg) <span class="required">*</span></label>
                                <input type="number" class="input" placeholder="请输入重量" required>
                            </div>
                            <div class="form-field">
                                <label>体积(m³)</label>
                                <input type="number" class="input" placeholder="请输入体积">
                            </div>
                        </div>
                    </div>

                    <div class="form-section">
                        <h3 class="form-section-title">时效要求</h3>
                        <div class="form-row">
                            <div class="form-field">
                                <label>时效类型</label>
                                <select class="select">
                                    <option value="normal">普通时效</option>
                                    <option value="urgent">加急</option>
                                    <option value="special">特快</option>
                                </select>
                            </div>
                            <div class="form-field">
                                <label>要求送达时间</label>
                                <input type="datetime-local" class="input">
                            </div>
                        </div>
                        <div class="form-field">
                            <label>备注</label>
                            <textarea class="textarea" placeholder="请输入备注信息"></textarea>
                        </div>
                    </div>

                    <div class="form-actions">
                        <button type="button" class="btn btn-secondary" onclick="window.location.href='orders.html'">取消</button>
                        <button type="submit" class="btn btn-primary">提交</button>
                    </div>
                </form>
            </div>
        </main>
    </div>

    <script src="../assets/js/app.js"></script>
    <style>
        .page-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .page-header h1 { font-size: 20px; margin: 0; }
        .form-section { margin-bottom: 24px; padding-bottom: 24px; border-bottom: 1px solid #f0f0f0; }
        .form-section:last-of-type { border-bottom: none; }
        .form-section-title { font-size: 16px; font-weight: 600; margin-bottom: 16px; color: #262626; }
    </style>
</body>
</html>
